# Local development overrides — merged automatically by `docker compose up`.
# Not committed for production. Create docker-compose.prod.yml (gitignored) for prod overrides.

services:

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: local

  agent:
    volumes:
      - ./apps/agent:/app
    command: ["poetry", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
