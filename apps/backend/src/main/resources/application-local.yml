spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:briefy}
    username: ${MYSQL_USER:briefy}
    password: ${MYSQL_PASSWORD:briefypassword}
  jpa:
    hibernate:
      # Phase 1 (Flyway 도입): 기존 로컬 데이터 보존을 위해 update 유지.
      # V1 baseline 검증 후 validate 로 전환 예정 (Phase 2).
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.briefy: DEBUG
    org.springframework.security: DEBUG

jwt:
  cookie-secure: false
  cookie-same-site: Lax

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth2/callback/google}

briefy:
  scheduler:
    enabled: false
  email:
    mode: log
    auto-send-enabled: false