spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  cookie-secure: true
  # SameSite=None is required because the frontend (briefy.store) and the API
  # (api.briefy.store) are served over credentialed cross-site requests.
  # This value is shared by both the JWT cookie and the OAuth state correlation
  # cookie (OAuthStateService), ensuring the state cookie survives Safari ITP's
  # bounce-tracking mitigation during the OAuth redirect chain.
  cookie-same-site: None

briefy:
  scheduler:
    enabled: ${SCHEDULER_ENABLED:false}
    daily-collection-cron: ${DAILY_COLLECTION_CRON:0 0 6 * * *}
    daily-briefing-cron: ${DAILY_BRIEFING_CRON:0 0 8 * * *}
  email:
    mode: ${EMAIL_MODE:log}
    auto-send-enabled: ${EMAIL_AUTO_SEND_ENABLED:false}
    from: ${SES_FROM_EMAIL:no-reply@briefy.com}
    aws-region: ${AWS_REGION:ap-northeast-2}
