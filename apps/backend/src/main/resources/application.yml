spring:
  application:
    name: briefy-backend

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/briefy}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

agent:
  url: ${AGENT_URL:http://localhost:8000}

google:
  client-id: ${GOOGLE_CLIENT_ID:not-configured}
  client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth2/callback/google}

kakao:
  client-id: ${KAKAO_CLIENT_ID:not-configured}
  client-secret: ${KAKAO_CLIENT_SECRET:not-configured}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/oauth2/callback/kakao}

jwt:
  secret: ${JWT_SECRET:development-secret-must-be-changed-in-production}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cookie-name: ${JWT_COOKIE_NAME:briefy_access_token}
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

briefy:
  briefing:
    agent-retry-max-attempts: ${BRIEFING_AGENT_RETRY_MAX_ATTEMPTS:2}
    agent-retry-backoff-seconds: ${BRIEFING_AGENT_RETRY_BACKOFF_SECONDS:5}
    job-max-retry-count: ${BRIEFING_JOB_MAX_RETRY_COUNT:3}
  collection:
    lookback-days: ${COLLECTION_LOOKBACK_DAYS:7}
    discovery-limit-per-source: ${COLLECTION_DISCOVERY_LIMIT_PER_SOURCE:300}
    detail-fetch-limit-per-source: ${COLLECTION_DETAIL_FETCH_LIMIT_PER_SOURCE:60}
    max-results-per-source: ${COLLECTION_MAX_RESULTS_PER_SOURCE:100}
    max-total-results: ${COLLECTION_MAX_TOTAL_RESULTS:500}
    agent-retry-max-attempts: ${COLLECTION_AGENT_RETRY_MAX_ATTEMPTS:2}
    agent-retry-backoff-seconds: ${COLLECTION_AGENT_RETRY_BACKOFF_SECONDS:5}
    job-max-retry-count: ${COLLECTION_JOB_MAX_RETRY_COUNT:3}
  classifier:
    version: ${CLASSIFIER_VERSION:1.0.0}
  classification:
    mode: ${CLASSIFICATION_MODE:OFF}
    classifier-version: ${CLASSIFIER_VERSION:1.0.0}
    worker:
      fixed-delay-ms: ${CLASSIFICATION_WORKER_FIXED_DELAY_MS:60000}
      max-items-per-run: ${CLASSIFICATION_WORKER_MAX_ITEMS_PER_RUN:100}
      budget-seconds: ${CLASSIFICATION_WORKER_BUDGET_SECONDS:600}
      batch-size: ${CLASSIFICATION_WORKER_BATCH_SIZE:5}
      max-concurrent-requests: ${CLASSIFICATION_WORKER_MAX_CONCURRENT_REQUESTS:2}
      agent-timeout-seconds: ${CLASSIFICATION_WORKER_AGENT_TIMEOUT_SECONDS:90}
      lease-seconds: ${CLASSIFICATION_WORKER_LEASE_SECONDS:700}
      max-attempts: ${CLASSIFICATION_WORKER_MAX_ATTEMPTS:5}
      backoff-base-seconds: ${CLASSIFICATION_WORKER_BACKOFF_BASE_SECONDS:60}
  scheduler:
    enabled: false
    daily-collection-cron: "0 0 6 * * *"
    daily-briefing-cron: "0 0 8 * * *"
    zone: Asia/Seoul
  email:
    mode: log
    auto-send-enabled: false
    from: "no-reply@briefy.com"
    fake-output-dir: "./build/fake-emails"
    aws-region: ${AWS_REGION:ap-northeast-2}
