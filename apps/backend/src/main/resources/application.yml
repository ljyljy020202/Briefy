spring:
  application:
    name: briefy-backend

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/briefy}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

agent:
  url: ${AGENT_URL:http://localhost:8000}
