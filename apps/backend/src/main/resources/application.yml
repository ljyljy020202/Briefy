spring:
  application:
    name: briefy-backend

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/briefy}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

agent:
  url: ${AGENT_URL:http://localhost:8000}

google:
  client-id: ${GOOGLE_CLIENT_ID:not-configured}
  client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth2/callback/google}

jwt:
  secret: ${JWT_SECRET:development-secret-must-be-changed-in-production}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cookie-name: ${JWT_COOKIE_NAME:briefy_access_token}
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
