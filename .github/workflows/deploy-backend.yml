name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "docker-compose.prod.yml"
      - "docker-compose.prod.yml.example"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: briefy-backend-prod
  cancel-in-progress: false

env:
  IMAGE_NAME: briefy-backend

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy Backend to EC2
    runs-on: [self-hosted, briefy-prod]
    needs: build-and-push

    steps:
      - name: Pull and recreate backend container
        run: |
          set -e
          cd /home/ubuntu/apps/Briefy

          echo "Pull backend image"
          docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend

          echo "Restart backend"
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate --no-build --no-deps backend

          echo "Status"
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps

          echo "Health check"
          for i in $(seq 1 18); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              echo "Backend is healthy"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "Health check failed after 90 seconds"
              exit 1
            fi
            echo "Waiting for backend... ($i/18)"
            sleep 5
          done

          echo "Backend deploy completed"

      - name: Prune unused Docker images
        if: always()
        run: docker image prune -af
