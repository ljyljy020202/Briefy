name: Frontend CI

on:
  push:
    paths:
      - "apps/frontend/**"
  pull_request:
    paths:
      - "apps/frontend/**"

defaults:
  run:
    working-directory: apps/frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
