name: Deploy Agent

on:
  push:
    branches:
      - main
    paths:
      - "apps/agent/**"
      - "docker-compose.prod.yml"
      - "docker-compose.prod.yml.example"
      - ".github/workflows/deploy-agent.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: briefy-agent-prod
  cancel-in-progress: false

env:
  IMAGE_NAME: briefy-agent

jobs:
  test:
    name: Agent Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run tests
        run: poetry run pytest

  build-and-push:
    name: Build and Push Agent Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/agent
          file: ./apps/agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy Agent to EC2
    runs-on: [self-hosted, briefy-prod]
    needs: build-and-push

    steps:
      - name: Pull and recreate agent container
        run: |
          set -e
          cd /home/ubuntu/apps/Briefy

          echo "Pull agent image"
          docker compose --env-file .env.prod -f docker-compose.prod.yml pull agent

          echo "Restart agent"
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate --no-build --no-deps agent

          echo "Status"
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps

          echo "Agent health check"
          sleep 10
          docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T agent python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=5).read().decode())"

          echo "Agent deploy completed"
